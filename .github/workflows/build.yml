name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para colgar los binarios en la release

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install toolchain
        run: pip install --upgrade platformio esptool==4.8.1

      # La versión vive en platformio.ini (custom_version). Si la etiqueta dice otra
      # cosa, el badge enseñaría un número y la release otro: mejor que falle aquí.
      - name: Check the tag matches custom_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          WANT=$(sed -n 's/^custom_version *= *\([^ ;]*\).*/\1/p' platformio.ini)
          test "${GITHUB_REF_NAME}" = "v${WANT}" || { echo "Tag ${GITHUB_REF_NAME} != v${WANT}"; exit 1; }

      - name: Build
        run: pio run -e badge

      # El flasher web (esptool-js) graba un solo fichero en 0x0. En el ESP32-S3 el
      # bootloader va en 0x0 (en el ESP32 normal iría en 0x1000).
      - name: Merge into a single flashable image
        run: |
          set -eu
          OUT=.pio/build/badge
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir -p dist
          python -m esptool --chip esp32s3 merge_bin \
            -o dist/opensourcebadge-factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$OUT/bootloader.bin" \
            0x8000  "$OUT/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$OUT/firmware.bin"
          cp "$OUT/firmware.bin" dist/opensourcebadge-firmware.bin
          cp "$OUT/firmware.elf" dist/opensourcebadge-firmware.elf
          (cd dist && sha256sum opensourcebadge-* | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: opensourcebadge
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
