; OPEN SOURCE BADGE · Bitcoin Amsterdam 2026
;
; Firmware del badge "Proof of Peer": una placa HAT con 20 LEDs y 3 botones
; encima de un LilyGO T-Display-S3 (ESP32-S3, pantalla 170x320).
;
; Compilar y grabar:   pio run -t upload
; Ver el puerto serie: pio device monitor

[env:badge]
platform  = espressif32@6.9.0          ; Arduino-ESP32 2.0.17, el mismo que el Seeder
board     = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -Wall
    ; La configuración de la pantalla va en include/tft_setup.h, no dentro de
    ; la librería: así una actualización de TFT_eSPI no la pisa.
    -DUSER_SETUP_LOADED=1
    -include include/tft_setup.h
    -DDISABLE_ALL_LIBRARY_WARNINGS   ; los avisos de TFT_eSPI no aportan nada aquí
    -Wno-unknown-pragmas             ; el codificador QR usa #pragma mark
